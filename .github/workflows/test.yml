# Runs what the README tells a contributor to run, on every push and pull
# request. Nothing here is clever: if it does not match `make test` locally,
# the local one is the definition and this is wrong.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The floor and the ceiling, and both platforms the README promises.
    # The floor is what the project says it needs -- go.mod says 1.21 and
    # pyproject says 3.9 -- and is where a syntax or stdlib slip shows up. The
    # ceiling is where a deprecation shows up first. macOS runs the ceiling
    # only: the floor's Python has no build for the arm64 runners, and what
    # macOS is here to catch is the platform, not the version -- term_bsd.go
    # is compiled nowhere else, and termios, select and the pty are BSD's
    # rather than glibc's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.21"
            python: "3.9"
          - os: ubuntu-latest
            go: "stable"
            python: "3.13"
          - os: macos-latest
            go: "stable"
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: gofmt
        # gofmt prints the files it would change and says nothing otherwise, so
        # any output at all is the failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The Python clock resolves ZIP codes through ziptz, which is a module of
      # its own; the Go clock links it through go.mod. Without it here the two
      # would differ on every ZIP, which difftest refuses to start rather than
      # report as hundreds of diffs.
      # Falls back to the tag while ziptz-us is not on PyPI yet. Written this
      # way round rather than pinned to the tag so that it starts using the
      # published wheel the moment there is one, with no edit here -- and so
      # that this file never claims an install path that does not work.
      - name: install ziptz
        run: pip install ziptz-us || pip install "git+https://github.com/choey/ziptz@v0.1.0"

      - name: compile the Python side
        run: python3 -m compileall -q clock.py tools

      # difftest, keytest, fitfuzz, argfuzz and docnums. The goldens in tools/golden
      # are bytes rendered on someone's machine, so this is also where a
      # tzdata change that moves a zone abbreviation would first show up --
      # as a golden failing, which is the right place for it to appear.
      - name: make test
        run: make test
