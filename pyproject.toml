[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name; the command it installs is still "clock", from
# [project.scripts] below. "clock" on PyPI is an unrelated datetime library
# from 2014 with a real release, so installing that name gets you something
# else entirely rather than an error -- which is why this is not it.
name = "terminal-clock"
version = "0.1.0"
description = "Analog terminal clocks, one face per time zone"
requires-python = ">=3.9"
readme = "README.md"
# The table form rather than PEP 639's bare SPDX string, which would need
# setuptools 77 where this asks for 61. Same choice as ziptz's.
license = { text = "MIT" }
authors = [{ name = "cho", email = "choey2k5@gmail.com" }]
# Required, so that a pip install gives the clock the README describes -- ZIP
# tokens included, since the zone table advertises them. ziptz-us is 23 KB with
# no dependencies of its own, by the same hand and on the same release cycle, so
# there is nothing to save by leaving it out; and the Go build has no way to
# make it optional at all, so requiring it here is what makes the two ports
# behave alike out of the box.
#
# pyclock.py still guards the import, and that guard is not for pip. It is
# for `cp pyclock.py /usr/local/bin/pyclock` -- one file, no packaging --
# where a ZIP
# token says what to install and every other kind of zone still works. difftest
# covers that path with two cases run from a directory ziptz is not in.
#
# ziptz-us on PyPI, ziptz to import: the bare name is an empty 2013 squat that
# pip cannot install. Naming it wrong here would resolve to nothing at all.
dependencies = ["ziptz-us"]

[project.scripts]
pyclock = "pyclock:main"

[tool.setuptools]
# pyclock, not clock. The Go build already owns "clock" -- that is the last
# element of its module path, so `go install` produces a binary by that name
# -- and the two have to be installable side by side rather than shadowing
# each other on PATH. As a module name "clock" is also already taken on PyPI
# by an unrelated 2014 package, and whichever of the two installs last
# silently overwrites the other.
py-modules = ["pyclock"]
# NOTICE ships with LICENSE because a clock installed from here carries ziptz's
# tables, and the ODbL attribution for them travels with the thing that carries
# them rather than with the repository they were generated in.
license-files = ["LICENSE", "NOTICE"]
